name: Regenerate Prisma lockfile

on:
  push:
    branches:
      - feat/prisma-persistence

permissions:
  contents: write

jobs:
  lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/prisma-persistence
      - uses: actions/setup-node@v7
        with:
          node-version: "24.x"
      - name: Install Yarn
        run: npm install --global yarn@1.22.22
      - name: Regenerate lockfile
        working-directory: public
        env:
          DATABASE_URL: postgresql://roost:roost@localhost:5432/roost
        run: yarn install
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/yarn.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: regenerate Prisma lockfile [skip ci]"
          git push
