services:
  app:
    build:
      context: ./public
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PORT: 3000
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airbnb}
      POSTGRES_USER: ${POSTGRES_USER:-airbnb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airbnb_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airbnb} -d ${POSTGRES_DB:-airbnb}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
